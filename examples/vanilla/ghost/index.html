<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghost Variations</title>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <script src="https://cdn.jsdelivr.net/npm/grid-canvas-system/dist/grid-canvas-system.umd.js"></script>
    <script>
      const grid = new GridCanvasSystem("canvas", {
        width: 420,
        height: 260,
      });

      grid.drawGhost({ x: 90, y: 130 }, 45, {
        feet: 4,
        fillColor: "#ef4444",
        strokeColor: "#ffffff",
      });

      grid.drawGhost({ x: 210, y: 130 }, 50, {
        feet: 5,
        fillColor: "#f472b6",
        strokeColor: "#ffffff",
      });

      grid.drawGhost({ x: 330, y: 130 }, 55, {
        feet: 6,
        fillColor: "#22d3ee",
        strokeColor: "#ffffff",
        rotation: Math.PI / 18,
      });
    </script>
  </body>
</html>
