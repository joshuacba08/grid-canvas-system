<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spaceship Variations</title>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <script src="https://cdn.jsdelivr.net/npm/grid-canvas-system/dist/grid-canvas-system.umd.js"></script>
    <script>
      const grid = new GridCanvasSystem("canvas", {
        width: 420,
        height: 260,
      });

      grid.drawShip(
        { x: 100, y: 130 },
        55,
        {
          rotation: -Math.PI / 2,
          curve1: 0.45,
          curve2: 0.8,
          guide: true,
        },
      );

      grid.drawShip(
        { x: 220, y: 130 },
        45,
        {
          rotation: 0,
          curve1: 0.2,
          curve2: 0.65,
          fillColor: "#001f33",
          strokeColor: "#7dd3fc",
          lineWidth: 2,
        },
      );

      grid.drawShip(
        { x: 320, y: 130 },
        45,
        {
          rotation: Math.PI / 2,
          curve1: 0.7,
          curve2: 0.95,
          fillColor: "#1a1200",
          strokeColor: "#facc15",
          lineWidth: 2,
        },
      );
    </script>
  </body>
</html>
