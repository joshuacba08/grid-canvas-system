<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tilemap Scene</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #080b0f;
        color: #e5edf5;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(100% - 32px, 640px);
      }

      h1,
      p {
        margin: 0 0 12px;
      }

      canvas {
        display: block;
        width: 100%;
        border: 1px solid #334155;
        image-rendering: pixelated;
        outline: none;
      }

      canvas:focus {
        border-color: #facc15;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tilemap scene</h1>
      <p>Enter starts, arrows move, Escape pauses. Collect all coins.</p>
      <canvas id="canvas"></canvas>
    </main>

    <script type="module">
      import GridCanvasSystem from "../../../dist/grid-canvas-system.es.js";

      const origin = { x: 40, y: 60 };
      const tileSize = 24;
      const baseMap = [
        "111111111111111",
        "100000100000001",
        "101110101111101",
        "102000000000201",
        "101011111010101",
        "100010000010001",
        "111010111010111",
        "100000100000001",
        "102111101111201",
        "100000000000001",
        "111111111111111",
      ];
      const grid = new GridCanvasSystem("canvas", {
        width: 640,
        height: 380,
        backgroundColor: "#050708",
        gridColor: "rgba(34, 197, 94, 0.14)",
        gridLabelColor: "rgba(255, 255, 255, 0)",
        coordinateLabelColor: "rgba(255, 255, 255, 0)",
        cellSize: 24,
        majorStep: 48,
      });
      const keys = GridCanvasSystem.runtime.createKeyTracker(grid.canvas, {
        autoFocus: true,
        preventDefaultKeys: [
          "ArrowUp",
          "ArrowDown",
          "ArrowLeft",
          "ArrowRight",
          "Escape",
        ],
      });
      const wall = GridCanvasSystem.compilePixelSprite(
        ["1111", "1221", "1221", "1111"],
        {
          1: "#22c55e",
          2: "#052e16",
        },
      );
      const coin = GridCanvasSystem.compilePixelSprite(["010", "111", "010"], {
        0: "transparent",
        1: "#facc15",
      });
      const tileset = {
        1: wall,
        2: coin,
      };
      let activeMap = [...baseMap];
      let player = { x: origin.x + tileSize * 1.5, y: origin.y + tileSize * 1.5 };
      let direction = 0;
      let score = 0;
      let totalCoins = countCoins(activeMap);
      let time = 0;

      function countCoins(map) {
        return map.reduce(
          (total, row) => total + Array.from(row).filter((tile) => tile === "2").length,
          0,
        );
      }

      function resetGame() {
        activeMap = [...baseMap];
        player = { x: origin.x + tileSize * 1.5, y: origin.y + tileSize * 1.5 };
        direction = 0;
        score = 0;
        totalCoins = countCoins(activeMap);
        time = 0;
      }

      function playerRect(position = player) {
        return {
          x: position.x - 7,
          y: position.y - 7,
          width: 14,
          height: 14,
        };
      }

      function tryMove(dx, dy) {
        const next = {
          x: player.x + dx,
          y: player.y + dy,
        };

        if (
          !GridCanvasSystem.runtime.hitTestTileMap(playerRect(next), activeMap, ["1"], {
            origin,
            tileSize,
          })
        ) {
          player = next;
        }
      }

      function collectCoin() {
        const tile = GridCanvasSystem.runtime.getTileAt(player, activeMap, {
          origin,
          tileSize,
        });

        if (tile !== "2") {
          return;
        }

        const cell = GridCanvasSystem.runtime.canvasToGrid(player, {
          cellSize: tileSize,
          origin,
        });

        activeMap = GridCanvasSystem.runtime.setTileAt(activeMap, cell, "0");
        score += 1;

        if (score >= totalCoins) {
          manager.transition("gameOver");
        }
      }

      function drawWorld() {
        GridCanvasSystem.runtime.drawTileMap(activeMap, tileset, {
          grid,
          origin,
          tileSize,
        });
        grid.drawPacman(
          player.x,
          player.y,
          10,
          GridCanvasSystem.runtime.oscillate01(time, 8),
          {
            direction,
            fillColor: "#facc15",
            strokeColor: "#050708",
          },
        );
        grid.drawValueLabel("coins", score, 40, 32, {
          color: "#e5edf5",
          font: "15px sans-serif",
        });
      }

      function drawCentered(primary, secondary) {
        grid.drawMessage(
          primary,
          secondary,
          { x: 320, y: 178 },
          {
            color: "#facc15",
            mainFont: "28px sans-serif",
            subColor: "#e5edf5",
            subFont: "15px sans-serif",
          },
        );
      }

      const manager = GridCanvasSystem.runtime.createSceneManager({
        initial: "menu",
        scenes: {
          menu: {
            draw() {
              grid.clearCanvas();
              drawCentered("TILE MAZE", "Press Enter to start");
            },
          },
          game: {
            update(step) {
              time += step;

              const speed = 104 * step;

              if (keys.isPressed("ArrowLeft")) {
                direction = Math.PI;
                tryMove(-speed, 0);
              }

              if (keys.isPressed("ArrowRight")) {
                direction = 0;
                tryMove(speed, 0);
              }

              if (keys.isPressed("ArrowUp")) {
                direction = -Math.PI / 2;
                tryMove(0, -speed);
              }

              if (keys.isPressed("ArrowDown")) {
                direction = Math.PI / 2;
                tryMove(0, speed);
              }

              collectCoin();
            },
            draw() {
              grid.clearCanvas();
              drawWorld();
            },
          },
          pause: {
            draw() {
              grid.clearCanvas();
              drawWorld();
              drawCentered("PAUSED", "Press Enter or Escape to resume");
            },
          },
          gameOver: {
            draw() {
              grid.clearCanvas();
              drawWorld();
              drawCentered("CLEAR", "Press Enter to play again");
            },
          },
        },
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && manager.getSceneId() === "menu") {
          resetGame();
          manager.transition("game");
          return;
        }

        if (event.key === "Enter" && manager.getSceneId() === "gameOver") {
          resetGame();
          manager.transition("game");
          return;
        }

        if (
          (event.key === "Enter" || event.key === "Escape") &&
          manager.getSceneId() === "pause"
        ) {
          manager.transition("game");
          return;
        }

        if (event.key === "Escape" && manager.getSceneId() === "game") {
          manager.transition("pause");
        }
      });

      GridCanvasSystem.runtime.createFixedStepLoop({
        autoStart: true,
        step: 1 / 60,
        update: (step) => manager.update(step),
        draw: () => manager.draw(),
      });
    </script>
  </body>
</html>
