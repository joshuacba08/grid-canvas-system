name: Publish to npm

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      soak:
        description: Also run the 30-minute soak
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Determine unpublished version
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: npm-publish
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Require source on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Plan release without overwriting existing versions
        id: release
        run: node scripts/prepare-npm-release.mjs
      - name: Check npm authentication before running release checks
        if: steps.release.outputs.publish == 'true'
        run: npm whoami --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  quality:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/quality.yml
    with:
      soak: ${{ inputs.soak || false }}
  publish:
    name: Publish package
    runs-on: ubuntu-24.04
    environment: npm-publish
    timeout-minutes: 20
    needs: [prepare, quality]
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Record physical-device acceptance status
        run: |
          node --input-type=module <<'NODE'
          import { readFile, appendFile } from 'node:fs/promises';
          const certification = JSON.parse(await readFile('docs/stability/certification.json', 'utf8'));
          await appendFile(process.env.GITHUB_STEP_SUMMARY, `Physical-device and complete-promise certification: ${certification.status}. Publication does not change acceptance results.\n`);
          NODE

      - name: Verify installed package and strict consumer types
        run: pnpm run verify:package-exports

      - name: Pack the release
        run: |
          mkdir -p tests/__artifacts__/npm-release
          npm pack --json --pack-destination tests/__artifacts__/npm-release > tests/__artifacts__/npm-release/pack.json

      - name: Publish to npm
        run: npm publish "./tests/__artifacts__/npm-release/grid-canvas-system-${RELEASE_VERSION}.tgz" --tag "$RELEASE_TAG" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Record registry receipt
        run: |
          npm view "grid-canvas-system@${RELEASE_VERSION}" version dist.integrity dist.attestations --json > tests/__artifacts__/npm-release/registry.json
          echo "Published grid-canvas-system@${RELEASE_VERSION} to ${RELEASE_TAG}." >> "$GITHUB_STEP_SUMMARY"

      - name: Save release artifact and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-release
          if-no-files-found: ignore
          path: tests/__artifacts__/npm-release/
